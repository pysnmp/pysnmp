name: Docs Build

# Rebuild Sphinx documentation whenever files under docs/ change.
# Warnings are treated as errors (-W) so that broken cross-references,
# missing toctree entries, or invalid RST syntax fail the build.

on:
  push:
    branches: [main, develop, next]
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yml"
  pull_request:
    branches: [main, develop, next]
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yml"

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build HTML documentation with Sphinx
        run: |
          sphinx-build -W -b html docs/source docs/build/html

      - name: Upload built documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html