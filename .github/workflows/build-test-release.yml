name: CI

on:
  push:
    branches:
      - "main"
      - "develop"
  pull_request:
    branches: [main, develop]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/v1.6.3/scripts/download-actionlint.bash)
      - uses: pre-commit/action@v3.0.1

  review_secrets:
    name: security-detect-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: "0"
      - name: Trufflehog Actions Scan
        uses: edplato/trufflehog-actions-scan@v0.9j-beta
        with:
          scanArguments: "--max_depth 30 -x .github/workflows/exclude-patterns.txt"

  semgrep:
    runs-on: ubuntu-latest
    name: security-sast-semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        id: semgrep
        uses: semgrep/semgrep-action@v1
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}

  publish:
    name: Build Release
    permissions:
      actions: write
      contents: write
      issues: write
      id-token: write
    environment: release    
    needs:
      #- pre-commit
      #- review_secrets
      - semgrep
      #- run-unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"          
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4.0.0
        id: semantic   # Need an `id` for output variables
        with:
          #semantic_version: 19.0.5
          extra_plugins: |
            semantic-release-replace-plugin
            @semantic-release/git@10.0.1
            @semantic-release/changelog@6.0.3
            conventional-changelog-conventionalcommits@6.1.0
            @semantic-release/exec@6.0.3               
        env:
          GITHUB_TOKEN: ${{ secrets.SEMREL_TOKEN }}
      - name: Publish package distributions to PyPI
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1          
      - uses: actions/upload-artifact@v4
        if: steps.semantic.outputs.new_release_published == 'true'
        with:
          name: dist
          path: dist
