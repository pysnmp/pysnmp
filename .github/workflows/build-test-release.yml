name: CI

# This copy of the workflow only ever runs for commits on a 5.x maintenance
# branch: main and next carry their own. So it triggers on the maintenance
# branches alone, and releases only from them.
on:
  push:
    branches:
      - "[0-9]+.x"
  pull_request:
    branches: ["[0-9]+.x"]
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # pre-commit/action is archived at v3.0.1 and pins actions/cache@v4
      # inside itself, which runs on the deprecated Node 20 runtime. Its steps
      # are short enough to keep here instead, as main does.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --color=always --all-files

  publish:
    name: Build Release
    # A pull request runs the checks above but has nothing to release.
    if: github.event_name != 'pull_request'
    permissions:
      actions: write
      contents: write
      issues: write
      id-token: write
    # PyPI Trusted Publishing matches this workflow's filename and this
    # environment; 5.0.25 was published through exactly this pair.
    environment: release
    env:
      # Only a hand dispatch releases. Every push rehearses the release and
      # stops.
      DRY: ${{ github.event_name != 'workflow_dispatch' }}
    needs:
      - pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          # semantic-release 25 needs ^22.14, and @semantic-release/changelog
          # and /git need ^22.22.2 || >=24.15. Same pin as next.
          node-version: "24"
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic   # Need an `id` for output variables
        with:
          semantic_version: 25
          dry_run: ${{ env.DRY }}
          # Pinned to majors, and to the set next uses, so both lines resolve
          # the same plugins. The preset stays on 9: 10 renders through
          # conventional-changelog-writer@9, which semantic-release 25 does
          # not carry.
          extra_plugins: |
            @semantic-release/exec@7
            @semantic-release/git@11
            @google/semantic-release-replace-plugin@1
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.SEMREL_TOKEN }}
      - name: Build dev preview
        if: env.DRY == 'true' && steps.semantic.outputs.new_release_version != ''
        env:
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          sed -i -E "s/^version ?=.*/version = \"${VERSION}.dev${{ github.run_number }}\"/" pyproject.toml
          uv build
      - name: Publish package distributions to PyPI
        if: env.DRY != 'true' && steps.semantic.outputs.new_release_published == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
      - uses: actions/upload-artifact@v7
        if: hashFiles('dist/*') != ''
        with:
          name: dist
          path: dist
