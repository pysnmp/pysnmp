[project]
name = "pysnmplib"
version = "5.0.24"
description = "Pure-Python SNMP v1/v2c/v3 engine"
authors = [
    { name = "omrozowicz", email = "omrozowicz@splunk.com" },
    { name = "rfaircloth-splunk", email = "rfaircloth-splunk@splunk.com" },
]
license = "BSD-2-Clause"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
dependencies = [
    "pysnmp-pysmi >=1.0.4,<2.0.0",
    "pycryptodomex >=3.11.0,<4.0.0",
    "pysnmp-pyasn1 >=1.1.3,<2.0.0",
]

[project.urls]
repository = "https://github.com/pysnmp/pysnmp"

[project.optional-dependencies]
dev = [
    "sphinx >=4.3.0,<5.0.0",
    "pytest >=6.2.5,<9.0.0",
    "codecov >=2.1.12,<3.0.0",
    "pytest-codecov >=0.4.0,<1.0.0",
    "pyasyncore ==1.0.5",
    "snmpsim ==0.4.7",
]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pysnmp"]

[tool.hatch.build.targets.sdist]
include = [
    "pysnmp",
    "docs",
    "tests",
    "examples",
]
