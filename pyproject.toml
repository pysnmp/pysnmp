[project]
name = "pysnmplib"
version = "6.0.0-rc.1"
description = "Pure-Python SNMP v1/v2c/v3 engine"
authors = [
    { name = "omrozowicz", email = "omrozowicz@splunk.com" },
    { name = "rfaircloth-splunk", email = "rfaircloth-splunk@splunk.com" },
]
license = "BSD-2-Clause"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
dependencies = [
    "pysnmp-pysmi >=1.0.4,<3.0.0",
    "pycryptodomex >=3.11.0,<4.0.0",
    "pysnmp-pyasn1 >=1.2.0b9,<2.0.0",
]

[project.urls]
repository = "https://github.com/pysnmp/pysnmp"

[project.optional-dependencies]
dev = [
    "sphinx >=5.0.0,<8.0.0",
    "pytest >=6.2.5,<9.0.0",
    "coverage[toml] >=7.2.0,<8.0.0",
    "codecov >=2.1.12,<3.0.0",
    "pytest-codecov >=0.4.0,<1.0.0",
    "mypy >=1.0.0,<2.0.0",
    "ruff >=0.4.0,<1.0.0",
]

[tool.coverage.run]
branch = true
source = ["pysnmp"]

[tool.coverage.report]
fail_under = 63
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.uv.sources]
pysnmp-pyasn1 = { git = "https://github.com/pysnmp/pyasn1", tag = "v1.2.0-beta.9" }

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pysnmp"]

[tool.hatch.build.targets.sdist]
include = [
    "pysnmp",
    "docs",
    "tests",
    "examples",
    "tools",
]

# ---------------------------------------------------------------------------
# Linting / formatting / typing configuration (Phase 0 of code quality sweep)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 99
target-version = "py310"
extend-exclude = [".eggs", ".git", ".hg", ".mypy_cache", ".tox", ".venv", "_build", "buck-out", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = [
    "E501",   # line-too-long: many legacy lines exceed 99; revisit in a later phase
    "UP031",  # printf-string-formatting: 182 sites, unsafe autofix; revisit separately
]

[tool.ruff.lint.per-file-ignores]
# Generated MIB modules bind their names via mibBuilder.importSymbols() at
# import time, so static analysis cannot see them.
"pysnmp/smi/mibs/**" = ["F821"]
# Package __init__ modules re-export the public API.
"**/__init__.py" = ["F401"]
# Examples are documentation and use star imports on purpose.
"examples/**" = ["F401", "F403", "F405", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["pysnmp"]
force-single-line = false

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["pysnmp"]

[[tool.mypy.overrides]]
module = "pysnmp.hlapi.*"
check_untyped_defs = true
