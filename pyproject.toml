[tool.poetry]
name = "pysnmplib"
version = "5.0.24"
description = ""
authors = ["omrozowicz <omrozowicz@splunk.com>", "rfaircloth-splunk <rfaircloth@splunk.com>"]
license = "BSD-2-Clause"
repository = "https://github.com/pysnmp/pysnmp"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"

packages = [
    { include = "pysnmp" },
]
include = ["docs", "tests", "examples"]


[tool.poetry.dependencies]
python = "^3.8"
pysnmp-pysmi = "^1.0.4"
pycryptodomex = "^3.11.0"
# Capped below 1.2.0 deliberately. pysnmp-pyasn1 1.2.0 removed
# pyasn1.compat, which pysnmp/debug.py imports at module scope
# (`from pyasn1.compat.octets import octs2ints`), so 1.2.0 and 1.3.0 break
# `import pysnmp` outright. The caret range this replaces admitted both, and
# poetry.lock pinning 1.1.3 hid it from anyone working in the repo: only a
# fresh `pip install pysnmplib` resolved to the newer release and failed.
# The 5.x line is closed, so the fix is the ceiling rather than the import.
pysnmp-pyasn1 = ">=1.1.3,<1.2.0"

[tool.poetry.dev-dependencies]
Sphinx = "^4.3.0"
pytest = "^6.2.5"
codecov = "^2.1.12"
pytest-codecov = "^0.4.0"

[tool.poetry.group.dev.dependencies]
codecov = "^2.1.13"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
